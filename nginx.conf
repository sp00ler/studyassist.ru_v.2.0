# Nginx конфигурация для StudyAssist
# Расположение: /etc/nginx/sites-available/studyassist

server {
    listen 80;
    listen [::]:80;
    server_name studyassist.ru www.studyassist.ru;

    # Автоматический редирект на HTTPS (Certbot добавит это автоматически)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studyassist.ru www.studyassist.ru;

    # SSL (будет заполнено Certbot)
    # ssl_certificate /etc/letsencrypt/live/studyassist.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/studyassist.ru/privkey.pem;

    # Безопасность
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Размер загружаемых файлов
    client_max_body_size 55M;

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private must-revalidate auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # Логи
    access_log /var/log/nginx/studyassist.access.log;
    error_log /var/log/nginx/studyassist.error.log;

    # Next.js приложение
    location / {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Статические файлы Next.js — кешируем
    location /_next/static/ {
        proxy_pass http://localhost:3000;
        proxy_cache_valid 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Загруженные файлы
    location /uploads/ {
        alias /var/www/studyassist/public/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        # Запрещаем исполнение скриптов из папки uploads
        location ~* \.(php|py|sh|cgi)$ {
            deny all;
        }
    }

    # Фавикон и статика
    location ~* \.(ico|css|js|gif|webp|png|jpg|jpeg|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://localhost:3000;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
    }

    # Webhook YuKassa — без кеширования
    location /api/payments/webhook {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Передаём тело запроса без буферизации для корректной проверки подписи
        proxy_request_buffering off;
    }

    # Блокировка прямых обращений к панели администратора с неправильным хостом
    location /admin {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
